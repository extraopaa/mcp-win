name: Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Fetch verified frpc and frps
        shell: pwsh
        run: ./scripts/fetch-frp.ps1
      - name: Check formatting
        run: cargo fmt --check
      - name: Fetch verified document engines
        shell: pwsh
        run: ./scripts/fetch-engines.ps1
      - name: Fetch verified tunnel and database engines
        shell: pwsh
        run: |
          ./scripts/fetch-cloudflared.ps1
          ./scripts/fetch-duckdb.ps1
      - name: Build embedded office editors
        shell: pwsh
        run: ./scripts/build-office.ps1
      - name: Test
        run: cargo test --locked
      - name: Build portable application
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: mcp-win-windows-x64
          path: dist/
          if-no-files-found: error
